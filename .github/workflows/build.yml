name: build-exe
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write          # release job uploads the zip on a v* tag
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -c "import excelauto.ui.window, excelauto.ui.app"
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - id: ver
        shell: bash
        run: echo "v=$(python tools/version_file.py)" >> "$GITHUB_OUTPUT"
      - run: pyinstaller --noconfirm --onedir --windowed --name ExcelAuto --splash assets/splash.png --version-file build/version_info.txt --add-data "변경기록.md;." main.py
      - shell: bash
        run: cp 변경기록.md dist/ExcelAuto/
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelAuto_v${{ steps.ver.outputs.v }}
          path: dist/ExcelAuto/
      - name: release (v* tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && 7z a -tzip "ExcelAuto_v${{ steps.ver.outputs.v }}.zip" ExcelAuto > /dev/null
          awk '/^## v${{ steps.ver.outputs.v }} /{f=1;next} /^## v/{f=0} f' ../변경기록.md > notes.md
          gh release create "${GITHUB_REF_NAME}" "ExcelAuto_v${{ steps.ver.outputs.v }}.zip" --repo "${GITHUB_REPOSITORY}" --title "ExcelAuto v${{ steps.ver.outputs.v }}" --notes-file notes.md
